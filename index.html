<style>
:root{
  --ink:#17262C; --muted:#5A6A70; --line:#D9E2E5;
  --surface:#FFFFFF; --surface-2:#F1F5F6; --shade:rgba(15,35,45,.22);
  --accent:#E8590C; --accent-ink:#FFFFFF; --accent-soft:#FDE7DA;
  --pin:#F0434E; --danger:#B42318; --night:#13324A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E6EEF0; --muted:#97A8AE; --line:#2A3B44;
    --surface:#132029; --surface-2:#1A2A34; --shade:rgba(0,0,0,.5);
    --accent:#FF7A2E; --accent-ink:#1A0F08; --accent-soft:#3A2416; --danger:#FF8A7A;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#map{position:fixed;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* gate */
.gate{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:var(--night);padding:24px}
.gate-card{width:min(360px,100%);text-align:center;color:#E9F1F5}
.gate-card img{border-radius:16px}
.gate-card h1{margin:14px 0 4px;font-size:26px;letter-spacing:-.01em}
.gate-card p{margin:0 0 22px;color:#A9BFCC;white-space:pre-line}
.ghost{width:100%;height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#E9F1F5;margin-top:10px;font-weight:500}

/* top */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.brand,.chipbtn,.round,.pillsel select,.searchbar{pointer-events:auto}
.brand{background:var(--surface);box-shadow:0 2px 10px var(--shade);border:0;border-radius:14px;padding:7px 14px 8px;text-align:left;display:flex;flex-direction:column}
.brand-t{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.brand-s{color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:8px}
.chipbtn{height:44px;border-radius:22px;padding:0 16px;font-weight:500;display:flex;align-items:center;gap:6px;background:var(--surface);box-shadow:0 2px 10px var(--shade);border:0}
.chipbtn svg,.round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillsel{position:relative}
.pillsel select{height:44px;border-radius:22px;border:0;background:var(--surface);box-shadow:0 2px 10px var(--shade);padding:0 34px 0 16px;font-weight:500;font-size:15px;-webkit-appearance:none;appearance:none;color:var(--ink)}
.pillsel svg{position:absolute;right:12px;top:14px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.searchbar{flex:1 1 100%;order:3;min-height:46px}
.searchbar gmp-place-autocomplete{width:100%;color-scheme:light;border-radius:23px;box-shadow:0 2px 10px var(--shade)}
.searchbar input.fallback{width:100%;height:46px;border-radius:23px;border:0;background:var(--surface);box-shadow:0 2px 10px var(--shade);padding:0 18px;font-size:16px;outline:none}
@media (min-width:760px){.searchbar{flex:0 1 420px;order:0;margin-right:auto}}

.side{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:500;display:flex;flex-direction:column;gap:8px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 2px 10px var(--shade);border:0}
.round.on{background:var(--accent);color:var(--accent-ink)}
.round .mtxt{font-weight:700;font-size:15px}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:480;pointer-events:none}
.hint span{display:block;background:rgba(15,25,35,.86);color:#fff;border-radius:20px;padding:9px 16px;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 10px var(--shade)}
.hint.mode span{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,10px);opacity:0;z-index:2100;background:rgba(15,25,35,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ring{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--pin);z-index:950;pointer-events:none;transform:scale(.2);opacity:.95;animation:grow .55s linear forwards}
@keyframes grow{to{transform:scale(1);opacity:.4}}
@media (prefers-reduced-motion: reduce){.ring{animation:none;transform:scale(1);opacity:.5}.sheet,.toast,.pin-dot{transition:none!important}}

/* pins (네이버 스타일: 빨간 원 + 흰 별 + 이름) */
#map{--ps:28px;--pf:13px}
.pin{position:relative;width:var(--ps);height:var(--ps);transform:translateY(50%);cursor:pointer}
.pin-dot{width:100%;height:100%;border-radius:50%;background:var(--pin);border:calc(var(--ps)*.09 + 1px) solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .15s ease}
.pin-dot svg{width:62%;height:62%;display:block}
.pin-dot path{fill:#fff}
.pin.cand .pin-dot{background:#fff;border-color:var(--pin)}
.pin.cand .pin-dot path{fill:var(--pin)}
.pin.sel .pin-dot{transform:scale(1.25)}
.pin.draft .pin-dot{opacity:.8;border-style:dashed}
.pin-lbl{position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);font-size:var(--pf);font-weight:700;line-height:1.25;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000,0 1px 2px #000;pointer-events:none;letter-spacing:-.01em}
#map.lowz .pin-lbl{display:none}
#map.light-map .pin-lbl{color:#1C1C1C;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.snd{transform:translateY(50%);font-size:calc(var(--pf) + 1px);font-weight:700;font-style:italic;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000;padding:2px 3px;cursor:pointer;white-space:nowrap}
#map.light-map .snd{color:#2E5266;text-shadow:0 0 3px #fff,0 0 2px #fff}
.snd.mine{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.me-dot{width:20px;height:20px;border-radius:50%;background:#2F80ED;border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,128,237,.25);transform:translateY(50%)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #fff;background:rgba(240,67,78,.35);box-shadow:0 0 0 2px var(--pin);transform:translateY(50%);cursor:pointer}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px var(--shade);max-height:min(80%,720px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.grab{position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 18px}
.sheet-head h2{flex:1;margin:8px 0 0;font-size:19px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 20px;overscroll-behavior:contain}
@media (min-width:760px){
  .sheet{left:auto;top:0;right:0;width:400px;max-height:none;border-radius:0;transform:translateX(105%);padding-top:env(safe-area-inset-top,0px)}
  .sheet.open{transform:none}
  .grab{display:none}
}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.chip-s{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px;border:1.5px solid var(--pin);color:var(--pin)}
.chip-s.visited{background:var(--pin);color:#fff}
.kind{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.field{margin:14px 0 0}
.field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.55}
select.inp{-webkit-appearance:none;appearance:none;padding-right:36px}
.selwrap{position:relative}
.selwrap svg{position:absolute;right:12px;top:15px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.big-num{font-size:28px!important;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.addph{flex:none;width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:12px}
.primary{width:100%;height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;margin-top:18px}
.primary:disabled{opacity:.55}
.status{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0;min-height:1em}
.err{color:var(--danger)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.photos{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 4px;scroll-snap-type:x mandatory}
.photos button{flex:none;border:0;padding:0;border-radius:12px;overflow:hidden;width:min(72vw,300px);aspect-ratio:4/3;background:var(--surface-2);scroll-snap-align:start}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.memo{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0 0;font-size:15.5px;line-height:1.65}
.coord{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 0;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.act{flex:1 1 auto;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);padding:0 12px}
.act.danger{color:var(--danger)}
.who{margin:16px 0 0;font-size:13.5px;color:var(--muted)}
.who b{color:var(--ink);font-weight:500}
.cm-h{margin:22px 0 4px;font-size:15px;font-weight:700;border-top:1px solid var(--line);padding-top:16px}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.cm-top b{color:var(--ink);font-weight:500}
.cm p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-del{border:0;background:none;color:var(--muted);font-size:12.5px;padding:0}
.cm-form{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.cm-form textarea{min-height:44px;height:44px;resize:none;flex:1}
.cm-form button{height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.tabs{display:flex;gap:6px;margin:10px 0 0}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line)}
.row-dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pin);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.row-dot.cand{background:#fff;border-color:var(--pin)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-thumb{flex:none;width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.lightbox{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

/* search */
.searchbar{position:relative}
.searchbar input{width:100%;height:46px;border-radius:23px;border:0;background:var(--surface);box-shadow:0 2px 10px var(--shade);padding:0 44px 0 42px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.searchbar input:focus{box-shadow:0 0 0 2px var(--accent),0 2px 10px var(--shade)}
.searchbar .sicon{position:absolute;left:14px;top:13px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.searchbar .clr{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:22px;line-height:1}
.results{position:absolute;left:0;right:0;top:52px;background:var(--surface);border-radius:14px;box-shadow:0 6px 24px var(--shade);max-height:min(58vh,440px);overflow:auto;padding:4px 0 6px;overscroll-behavior:contain}
.results h4{margin:10px 16px 2px;font-size:12.5px;color:var(--muted);font-weight:500}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 16px;min-height:48px}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res .rt{flex:1;min-width:0}
.res b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rd{flex:none;width:20px;height:20px;border-radius:50%;background:var(--pin);border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.res .rd.cand{background:#fff;border-color:var(--pin)}
.res .rp{flex:none;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.res-empty{padding:12px 16px;color:var(--muted);font-size:14px;margin:0}

/* Leaflet 위 핀 (0x0 앵커 + 가운데 정렬) */
.leaflet-container{font-family:inherit;background:#0E2C46}
.lp{width:0!important;height:0!important;background:none;border:0;overflow:visible}
.lp .pin{position:absolute;left:0;top:0;width:var(--ps);height:var(--ps);transform:translate(-50%,-50%)}
.lp .spin,.lp .me-dot,.lp .snd{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.lp .pin-lbl{left:50%}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.7)!important;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-bottom.leaflet-left{margin-bottom:env(safe-area-inset-bottom,0px)}
.row-dot{display:inline-block}
.menu-btn{width:100%;margin-top:10px}
.danger-btn{color:var(--danger)}

</style>
</head>
<body>
<div id="map" aria-label="지도. 길게 누르면 포인트를 남길 수 있어요."></div>

<header class="top" id="top">
  <button class="brand" id="btnMenu" type="button" aria-label="메뉴">
    <span class="brand-t">포인트북</span>
    <span class="brand-s" id="count">불러오는 중</span>
  </button>
  <div class="searchbar" id="searchbar">
    <svg class="sicon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="장소 검색 (예: 오산항, 동명항)" aria-label="장소 검색">
    <button class="clr" id="qClear" type="button" aria-label="검색어 지우기" hidden>×</button>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="tools">
    <div class="pillsel"><select id="filter" aria-label="지도에 표시할 포인트">
      <option value="all">전체</option><option value="visited">갔던 곳</option><option value="candidate">후보지</option></select>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <button class="chipbtn" id="btnList" type="button" aria-label="포인트 목록 열기">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>목록</button>
  </div>
</header>

<div class="side" id="side">
  <button class="round" id="btnLocate" type="button" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
  <button class="round" id="btnType" type="button" aria-label="지도 종류 바꾸기"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <button class="round" id="btnDepth" type="button" aria-label="수심 기록 모드" aria-pressed="false"><span class="mtxt">m</span></button>
  <button class="round" id="btnIn" type="button" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="round" id="btnOut" type="button" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>

<div class="hint" id="hint"><span>지도를 꾹 누르면 그 자리에 포인트가 생겨요</span></div>
<div class="hint mode" id="modechip" hidden><span>수심 기록 중: 지도를 꾹 눌러 잰 수심을 남기세요</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<section class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2>
    <button class="x" id="sheetClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<input type="file" id="fileIn" accept="image/*" multiple class="sr" tabindex="-1">
<input type="file" id="importIn" accept="application/json,.json" class="sr" tabindex="-1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* 포인트북 체험판: 실제 지도(Esri 위성 / OpenStreetMap / OpenTopoMap) + 이 기기에만 저장 */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.8 6 6.6.8-4.9 4.5 1.3 6.5L12 17.1l-5.8 3.3 1.3-6.5-4.9-4.5 6.6-.8z"/></svg>';
const chev = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = '<path d="M6 9l6 6 6-6"/>'; return s; };
const pinSvg = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "rp"); s.innerHTML = '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'; return s; };
const KINDS = ["갯바위", "방파제", "선상", "백사장", "민물", "좌대"];
const STATUS = { visited: "내가 갔던 곳", candidate: "후보지" };
const METHODS = { finder: "어탐기", float: "찌·채비로 잼", guess: "어림짐작" };
const MAX_PHOTOS = 6;
const stOf = s => s && s.status === "candidate" ? "candidate" : "visited";
const fixed = n => Number(n).toFixed(5);
const isDesk = () => matchMedia("(min-width:760px)").matches;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "");
let toastT;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
function fmtTime(ts) {
  if (typeof ts !== "number") return "";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "방금"; if (m < 60) return m + "분 전";
  const hh = Math.floor(m / 60); if (hh < 24) return hh + "시간 전";
  const dd = Math.floor(hh / 24); if (dd < 7) return dd + "일 전";
  const d = new Date(ts); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

/* ---------------- 이 기기 저장소 (IndexedDB) ---------------- */
let DBH = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("pointbook-trial", 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ["spots", "depths", "photos"]) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const P = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
const store = (s, mode = "readonly") => DBH.transaction(s, mode).objectStore(s);
const getAll = s => P(store(s).getAll());
const put = (s, v) => P(store(s, "readwrite").put(v));
const del = (s, id) => P(store(s, "readwrite").delete(id));
const getOne = (s, id) => P(store(s).get(id));
const photoUrls = new Map();
async function photoUrl(id) {
  if (photoUrls.has(id)) return photoUrls.get(id);
  const rec = await getOne("photos", id); if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob); photoUrls.set(id, u); return u;
}
function photoImg(id, props) {
  const img = h("img", { alt: "", ...props });
  photoUrl(id).then(u => { if (u) img.src = u; });
  return img;
}

/* ---------------- 상태 ---------------- */
const S = { spots: new Map(), markers: new Map(), depths: new Map(), depthMarkers: new Map(), view: null, draft: null, searchPin: null, me: null, filter: "all", depthMode: false, lastLP: 0 };

/* ---------------- 지도 ---------------- */
const map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 5, maxZoom: 19, zoomSnap: .5, tapHold: false }).setView([36.2, 127.9], 7);
map.attributionControl.setPrefix(false);
const esriAttr = "위성: Esri, Maxar, Earthstar Geographics";
const LAYERS = [
  { name: "위성 + 지명", dark: true, layers: [
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 18, maxZoom: 19, attribution: esriAttr }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 18, maxZoom: 19, opacity: .85 }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 18, maxZoom: 19 })] },

  if (spots.length) { kids.push(h("h4", null, "내 포인트")); for (const s of spots) kids.push(h("button", { class: "res", type: "button", onclick: () => { closeResults(); qIn.blur(); openDetail(s.id, true); } }, h("span", { class: "rd" + (stOf(s) === "candidate" ? " cand" : "") }), h("span", { class: "rt" }, h("b", null, String(s.name)), h("span", null, String(s.region || ""))))); }
  kids.push(h("h4", null, "장소"));
  if (loading) kids.push(h("p", { class: "res-empty" }, "찾는 중이에요"));
  else if (remote === null) kids.push(h("p", { class: "res-empty" }, "장소를 검색하지 못했어요. 인터넷 연결을 확인하세요."));
  else if (remote && !remote.length) kids.push(h("p", { class: "res-empty" }, "찾는 곳이 없어요. 지역 이름을 함께 넣어 보세요 (예: 양양 오산항)."));
  else if (remote) for (const r of remote) kids.push(h("button", { class: "res", type: "button", onclick: () => goPlace(r.lat, r.lng, r.name) }, pinSvg(), h("span", { class: "rt" }, h("b", null, r.name), h("span", null, r.area))));
  if (remote && !loading && !KKEY) kids.push(h("p", { class: "res-empty" }, "항구나 방파제가 안 나오면 왼쪽 위 포인트북 → 카카오 장소 검색 연결을 해 보세요."));
  resBox.replaceChildren(...kids); resBox.hidden = false;
}
/* 카카오 장소 검색 (선택: 무료 JavaScript 키) */
let KKEY = ""; try { KKEY = localStorage.getItem("pb-kakao-key") || ""; } catch (_) {}
let kakaoP = null;
function loadKakao() {
  if (!KKEY) return Promise.reject(new Error("nokey"));
  if (kakaoP) return kakaoP;
  kakaoP = new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error("timeout")), 8000);
    const s = document.createElement("script");
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KKEY)}&libraries=services&autoload=false`;
    s.onload = () => { try { kakao.maps.load(() => { clearTimeout(to); res(new kakao.maps.services.Places()); }); } catch (e) { clearTimeout(to); rej(e); } };
    s.onerror = () => { clearTimeout(to); rej(new Error("load")); };
    document.head.append(s);
  });
  kakaoP.catch(() => { kakaoP = null; });
  return kakaoP;
}
async function searchKakao(q) {
  const places = await loadKakao();
  return new Promise((res, rej) => {
    places.keywordSearch(q, (data, status) => {
      const S2 = kakao.maps.services.Status;
      if (status === S2.OK) res(data.map(d => ({ name: d.place_name, area: [d.category_name ? d.category_name.split(" > ").pop() : "", d.address_name].filter(Boolean).join(", "), lat: +d.y, lng: +d.x })));
      else if (status === S2.ZERO_RESULT) res([]);
      else rej(new Error("kakao"));
    }, { size: 10 });
  });
}
async function searchNominatim(raw) {
  const wait = 1100 - (Date.now() - lastNomi); if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastNomi = Date.now();
  const r = await fetch(`${NOMI}/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(raw)}`);
  if (!r.ok) throw new Error("http");
  return (await r.json()).map(x => { const { nm, area } = shortName(x); return { name: nm, area, lat: +x.lat, lng: +x.lon }; });
}
let kakaoWarned = false;
async function searchRemote(raw) {
  if (cache.has(raw)) return cache.get(raw);
  let out;
  if (KKEY) {
    try { out = await searchKakao(raw); }
    catch (_) { if (!kakaoWarned) { kakaoWarned = true; toast("카카오 검색에 연결하지 못했어요. 키와 도메인 등록을 확인하세요.", 4000); } out = await searchNominatim(raw); }
  } else out = await searchNominatim(raw);
  cache.set(raw, out); return out;
}
async function doSearch() {
  const raw = qIn.value.trim(); if (raw.length < 2) { renderResults(undefined); return; }
  renderResults(undefined, true);
  try { const res = await searchRemote(raw); if (qIn.value.trim() === raw) renderResults(res); }
  catch (_) { if (qIn.value.trim() === raw) renderResults(null); }
}
qIn.oninput = () => { clearTimeout(qT); renderResults(cache.get(qIn.value.trim())); qT = setTimeout(doSearch, 700); };
qIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(qT); doSearch(); } else if (e.key === "Escape") { closeResults(); qIn.blur(); } };
qIn.onfocus = () => { if (qIn.value.trim()) renderResults(cache.get(qIn.value.trim())); };
qClr.onclick = () => { qIn.value = ""; qClr.hidden = true; closeResults(); if (S.searchPin) { map.removeLayer(S.searchPin); S.searchPin = null; } qIn.focus(); };
map.getContainer().addEventListener("pointerdown", () => { if (!resBox.hidden) { closeResults(); qIn.blur(); } }, true);

/* ---------------- 수심 ---------------- */
function setDepthMode(on) { S.depthMode = on; const b = $("#btnDepth"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); updateHint(); if (on && map.getZoom() < 14) toast("확대한 뒤 잰 자리를 꾹 누르세요"); }
$("#btnDepth").onclick = () => setDepthMode(!S.depthMode);
function depthMarker(d) {
  let m = S.depthMarkers.get(d.id);
  if (!m) { m = markerWith([d.lat, d.lng], () => h("div", { class: "snd" }, (Math.round(m._d.d * 10) / 10).toString())); m.on("click", () => openDepth(d.id)); S.depthMarkers.set(d.id, m); }
  m._d = d; m.setLatLng([d.lat, d.lng]); if (!map.hasLayer(m)) m.addTo(map);
}
function openDepthForm(ll) {
  if (S.draft) map.removeLayer(S.draft);
  S.draft = markerWith(ll, () => h("div", { class: "spin" }), { interactive: false, zIndexOffset: 2000 }).addTo(map);
  const num = h("input", { class: "inp big-num", id: "f-depth", type: "text", inputmode: "decimal", placeholder: "0.0", autocomplete: "off" });
  const meth = h("select", { class: "inp", id: "f-meth" }, Object.entries(METHODS).map(([k, v]) => h("option", { value: k }, v)));
  const note = h("input", { class: "inp", id: "f-dnote", maxlength: "60", placeholder: "예: 만조 1시간 전, 바닥 암반", autocomplete: "off" });
  const st = h("p", { class: "status" }), save = h("button", { class: "primary", type: "button" }, "수심 저장");
  save.onclick = async () => {
    const v = parseFloat(String(num.value).replace(",", "."));
    if (!isFinite(v) || v < 0 || v > 3000) { st.className = "status err"; st.textContent = "0에서 3000 사이 숫자(m)로 적어 주세요"; num.focus(); return; }
    const d = { id: uid(), lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6), d: Math.round(v * 10) / 10, method: meth.value, note: note.value.trim().slice(0, 60), createdAt: Date.now() };
    try { await put("depths", d); S.depths.set(d.id, d); depthMarker(d); closeSheet(); toast(`수심 ${d.d}m 저장됨`); }
    catch (_) { st.className = "status err"; st.textContent = "저장하지 못했어요"; }
  };
  openSheet("수심 기록", h("div", null,
    h("p", { class: "sub" }, `${fixed(ll.lat)}, ${fixed(ll.lng)}`),
    h("div", { class: "field" }, h("label", { for: "f-depth" }, "수심 (m)"), num),
    h("div", { class: "field" }, h("label", { for: "f-meth" }, "잰 방법"), h("div", { class: "selwrap" }, meth, chev())),
    h("div", { class: "field" }, h("label", { for: "f-dnote" }, "메모 (선택)"), note),
    save, st, h("p", { class: "note" }, "직접 잰 값이라 물때에 따라 달라요. 항해용으로 쓰지 마세요.")), { type: "form", id: null });
  focusOn(ll, map.getZoom()); setTimeout(() => num.focus(), 300);
}
function openDepth(id) {
  const d = S.depths.get(id); if (!d) return;
  openSheet(`수심 ${d.d}m`, h("div", null,
    h("div", { class: "coord" }, h("span", null, fixed(d.lat), ", ", fixed(d.lng)), h("button", { class: "link", type: "button", onclick: () => copy(`${fixed(d.lat)}, ${fixed(d.lng)}`) }, "좌표 복사")),
    h("p", { class: "memo" }, `잰 방법: ${METHODS[d.method] || "모름"}`, d.note ? `\n${d.note}` : ""),
    h("p", { class: "who" }, "기록한 때: ", fmtTime(d.createdAt)),
    h("div", { class: "acts" }, h("button", { class: "act danger", type: "button", onclick: async () => {
      if (!confirm("이 수심 기록을 지울까요?")) return;
      await del("depths", id).catch(() => {}); S.depths.delete(id); const m = S.depthMarkers.get(id); if (m) { map.removeLayer(m); S.depthMarkers.delete(id); } closeSheet(); toast("수심 기록을 지웠어요");
    } }, "삭제"))), { type: "depth", id: null });
}

/* ---------------- 내 위치 ---------------- */
const G = { watch: null, fixed: false, wantFly: false, moved: false, denied: false, last: null };
map.on("dragstart", () => { G.moved = true; });
function startGeo(manual) {
  if (!navigator.geolocation) { if (manual) toast("이 기기에서는 위치를 확인할 수 없어요"); return; }
  if (manual) { if (G.last) { map.flyTo(G.last, Math.max(map.getZoom(), 15), { duration: .6 }); return; } G.wantFly = true; toast("현재 위치를 찾는 중"); }
  if (G.watch !== null) return;
  G.watch = navigator.geolocation.watchPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude); G.last = ll;
    if (!S.me) { S.me = markerWith(ll, () => h("div", { class: "me-dot" }), { zIndexOffset: 500 }).addTo(map); S.me.on("click", () => startDraft(G.last)); }
    else S.me.setLatLng(ll);
    if (!G.fixed || G.wantFly) {
      if (G.wantFly || (!G.moved && !sheet.classList.contains("open"))) map.flyTo(ll, Math.max(map.getZoom(), 13), { duration: .8 });
      if (!G.fixed) toast("파란 점이 내 위치예요. 누르면 이 자리에 포인트를 남겨요");
      G.fixed = true; G.wantFly = false;
    }
  }, err => {
    if (G.watch !== null) navigator.geolocation.clearWatch(G.watch); G.watch = null;
    if (err.code === 1) { if (manual || !G.denied) { G.denied = true; toast("위치 권한이 꺼져 있어요. 설정에서 허용하면 내 위치가 자동으로 나와요", 4000); } }
    else if (manual || G.wantFly) toast("현재 위치를 찾지 못했어요. 잠시 뒤 다시 눌러 주세요");
    G.wantFly = false;
  }, { enableHighAccuracy: true, maximumAge: 20000, timeout: 20000 });
}
$("#btnLocate").onclick = () => startGeo(true);

/* ---------------- 메뉴: 백업 / 복원 ---------------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportAll() {
  toast("백업 파일을 만드는 중", 4000);
  const photos = [];
  for (const p of await getAll("photos")) photos.push({ id: p.id, data: await blobToData(p.blob) });
  const data = { app: "pointbook", v: 1, at: Date.now(), spots: [...S.spots.values()], depths: [...S.depths.values()], photos };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const name = `pointbook-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  const a = h("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function importAll(file) {
  try {
    const j = JSON.parse(await file.text()); if (!j || j.app !== "pointbook") throw new Error("format");
    for (const p of j.photos || []) { const b = await (await fetch(p.data)).blob(); await put("photos", { id: p.id, blob: b }); }
    for (const s of j.spots || []) if (typeof s.lat === "number") await put("spots", s);
    for (const d of j.depths || []) if (typeof d.lat === "number") await put("depths", d);
    await loadAll(); toast(`복원했어요: 포인트 ${(j.spots || []).length}개`);
  } catch (_) { toast("이 파일은 포인트북 백업이 아니에요"); }
}
$("#importIn").onchange = e => { const f = e.target.files[0]; if (f) importAll(f); e.target.value = ""; };
$("#btnMenu").onclick = () => openSheet("포인트북 체험판", h("div", null,
  h("p", { class: "memo" }, "지금은 체험판이라 포인트와 사진이 이 폰에만 저장돼요. 브라우저 기록을 지우면 함께 지워질 수 있으니, 가끔 백업해 두세요. 홈 화면에 추가해서 쓰면 더 안전해요."),
  h("div", { class: "acts" },
    h("button", { class: "act", type: "button", onclick: exportAll }, "백업 파일 저장"),
    h("button", { class: "act", type: "button", onclick: () => $("#importIn").click() }, "백업 불러오기")),
  h("h3", { class: "cm-h" }, "카카오 장소 검색 연결"),
  h("p", { class: "memo", style: "font-size:14.5px" }, "오산항, 동명항처럼 항구·방파제·낚시점까지 카카오맵 검색 결과로 찾을 수 있어요. 무료이고 카드 등록이 필요 없어요."),
  (() => {
    const inp = h("input", { class: "inp", placeholder: "카카오 JavaScript 키", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "카카오 JavaScript 키" }); inp.value = KKEY;
    const st = h("p", { class: "status" }, KKEY ? "연결됨" : "");
    const btn = h("button", { class: "primary", type: "button" }, "저장하고 시험하기");
    btn.onclick = async () => {
      KKEY = inp.value.trim(); try { localStorage.setItem("pb-kakao-key", KKEY); } catch (_) {}
      kakaoP = null; cache.clear(); kakaoWarned = false;
      if (!KKEY) { st.textContent = "연결을 해제했어요"; return; }
      st.className = "status"; st.textContent = "시험하는 중";
      try { const r = await searchKakao("양양 오산항"); st.textContent = r.length ? `연결됨: '${r[0].name}' 검색 성공` : "연결됨"; }
      catch (_) { st.className = "status err"; st.textContent = "연결 실패. 키가 맞는지, 플랫폼에 이 사이트 도메인을 등록했는지 확인하세요."; }
    };
    return h("div", null, inp, btn, st);
  })(),
  h("p", { class: "note" }, `키 받는 법: developers.kakao.com 로그인 → 내 애플리케이션 → 애플리케이션 추가 → 앱 키의 JavaScript 키 복사. 그리고 플랫폼(Web) 사이트 도메인에 ${location.origin} 를 등록하고, 카카오맵 사용 설정이 보이면 켜 주세요.`),
  h("p", { class: "note" }, "친구와 실시간 공유는 정식 버전(Firebase 연결)에서 돼요. 이 백업 파일은 정식 버전으로 옮길 때도 쓸 수 있어요."),
  h("p", { class: "note" }, "지도: Esri 위성사진, OpenStreetMap, OpenTopoMap. 장소 검색: 카카오(연결 시) 또는 OpenStreetMap Nominatim.")), { type: "menu" });

/* ---------------- 시작 ---------------- */
async function loadAll() {
  for (const m of S.markers.values()) map.removeLayer(m); for (const m of S.depthMarkers.values()) map.removeLayer(m);
  S.markers.clear(); S.depthMarkers.clear(); S.spots.clear(); S.depths.clear();
  for (const s of await getAll("spots")) if (typeof s.lat === "number") { S.spots.set(s.id, s); upsertMarker(s); }
  for (const d of await getAll("depths")) if (typeof d.lat === "number") { S.depths.set(d.id, d); depthMarker(d); }
  updateCount();
}
(async () => {
  try { DBH = await openDB(); await loadAll(); }
  catch (_) { $("#count").textContent = "저장 불가"; toast("이 브라우저에서는 저장 공간을 쓸 수 없어요. 사파리나 크롬 일반 창에서 열어 주세요.", 5000); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
  updateHint(); startGeo(false);
})();
