<style>
:root{
  --ink:#0F1E2B; --ink-2:#22323C; --muted:#5B6B76; --label:#3D4C55;
  --line:#DCE3E7; --line-2:#E6ECEF; --ground:#F2F5F6; --surface:#FFFFFF;
  --pin:#EF3E4A; --teal:#0E7C86; --teal-soft:#E3F1F2; --blue:#2F6FED; --chart:#2E5266;
  --shadow:0 6px 20px rgba(15,30,43,.14); --shadow-s:0 2px 8px rgba(15,30,43,.10);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#CFE3EC;overflow:hidden;-webkit-text-size-adjust:100%;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.i{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.light{stroke:#fff}.i.muted{stroke:var(--muted)}.i.blue{stroke:var(--blue)}.i.thick{stroke-width:2.6}.i.teal{stroke:var(--teal)}
.link{border:0;background:none;padding:6px 0;color:var(--teal);font-size:13px;font-weight:500}

#map{position:fixed;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;--ps:30px;--pf:12px}
.leaflet-container{font-family:inherit;background:#CFE3EC}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.75)!important;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-top.leaflet-right{top:auto}

/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:600;padding:calc(var(--st) + 12px) 16px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top-row{display:flex;gap:8px;pointer-events:auto}
.search-pill{flex:1;height:52px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);font-size:15px;text-align:left;min-width:0}
.search-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq-btn{width:52px;height:52px;border-radius:16px;border:0;background:var(--ink);box-shadow:0 6px 20px rgba(15,30,43,.22);display:grid;place-items:center;flex:none}
.chips-row{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:0;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-s);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;font-weight:700}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--pin)}
.chip .ring{width:10px;height:10px;border-radius:50%;border:2px solid var(--pin)}
.chip.on .ring{border-color:#fff}.chip.on .dot{background:#fff}

/* mode bar */
.mode-bar{position:fixed;left:16px;right:16px;top:calc(var(--st) + 12px);z-index:620;height:52px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;box-shadow:0 6px 20px rgba(15,30,43,.25)}
.mode-dot{width:10px;height:10px;border-radius:50%;background:var(--pin);flex:none}
.mode-t{flex:1;font-size:14px;font-weight:700;white-space:nowrap}
.mode-s{font-size:12px;color:#B9C7CF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-x{height:36px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;flex:none}
.center-pin{position:fixed;left:50%;top:50%;z-index:590;pointer-events:none;transform:translate(-50%,-50%)}
.center-pin .pin-dot{width:40px;height:40px}
.pick-actions{position:fixed;left:20px;right:20px;bottom:calc(var(--sb) + 24px);z-index:620}

/* fabs */
.fabs{position:fixed;right:16px;bottom:calc(var(--sb) + 268px);z-index:500;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
body.mode .fabs{bottom:calc(var(--sb) + 24px)}
.fab{width:46px;height:46px;border-radius:14px;border:0;background:var(--surface);box-shadow:0 4px 14px rgba(15,30,43,.16);display:grid;place-items:center}
.fab.depth{color:var(--teal);font-size:12px;font-weight:800;font-style:italic}
.fab.depth.on{background:var(--teal);color:#fff}

/* home panel */
.home{position:fixed;left:0;right:0;bottom:0;z-index:550;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(15,30,43,.14);padding-top:10px;transition:transform .25s}
body.mode .home{transform:translateY(110%)}
.grab{width:40px;height:5px;border-radius:3px;background:#D5DDE2;margin:0 auto 10px}
.home-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px 10px}
.home-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.cards{display:flex;gap:10px;overflow-x:auto;padding:0 20px 12px;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:96px}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:236px;border-radius:18px;background:var(--ground);display:flex;gap:12px;padding:10px;border:0;text-align:left;scroll-snap-align:start}
.card .ph{flex:none;width:64px;height:64px;border-radius:12px;background:#BFD6DF;object-fit:cover;display:grid;place-items:center}
.card .ph svg{width:26px;height:26px}
.card .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.card b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dp{color:var(--teal);font-weight:700}
.empty-card{flex:1;min-height:84px;border-radius:18px;background:var(--ground);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 16px;font-size:13.5px;color:var(--muted)}
.tabbar{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line-2);padding:8px 8px calc(var(--sb) + 8px)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);min-width:72px;padding:2px 0}
.tab.on{color:var(--ink);font-weight:700}
.tab-add{width:58px;height:58px;margin-top:-30px;border-radius:50%;border:4px solid #fff;background:var(--pin);box-shadow:0 6px 16px rgba(239,62,74,.4);display:grid;place-items:center}

/* pins on map */
.lp{width:0!important;height:0!important;background:none;border:0;overflow:visible}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:var(--ps);height:var(--ps)}
.pin-dot{width:100%;height:100%;border-radius:50%;background:var(--pin);border:calc(var(--ps)*.09 + 1.5px) solid #fff;box-shadow:0 3px 8px rgba(15,30,43,.3);display:grid;place-items:center;transition:transform .15s}
.center-pin .pin-dot{border-width:3px;border-style:dashed;box-shadow:0 0 0 10px rgba(239,62,74,.18)}
.pin-dot svg{width:56%;height:56%}
.pin-dot path{fill:#fff}
.pin.cand .pin-dot{background:#fff;border-color:var(--pin)}
.pin.cand .pin-dot path{fill:var(--pin)}
.pin.sel .pin-dot{transform:scale(1.25)}
.pin.draft .pin-dot{border-style:dashed;opacity:.9}
.pin-lbl{position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);font-size:var(--pf);font-weight:700;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none}
#map.dark .pin-lbl{color:#fff;text-shadow:0 0 3px #000,0 0 2px #000,0 1px 2px #000}
#map.lowz .pin-lbl{display:none}
.snd{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:calc(var(--pf) + 2px);font-weight:700;font-style:italic;font-variant-numeric:tabular-nums;color:var(--chart);text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;padding:3px}
.snd.mine{text-decoration:underline;text-decoration-color:var(--pin);text-decoration-thickness:2px;text-underline-offset:3px}
#map.dark .snd{color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.spin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px var(--pin);background:rgba(239,62,74,.25)}
.me{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 10px rgba(47,111,237,.18)}
.ring-lp{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--pin);z-index:950;pointer-events:none;transform:scale(.2);animation:grow .55s linear forwards}
@keyframes grow{to{transform:scale(1);opacity:.4}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:690;background:rgba(15,30,43,.28)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(15,30,43,.18);max-height:calc(100% - var(--st) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.open{transform:none}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sh-pad{padding:10px 20px calc(var(--sb) + 24px)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.x-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--ground);display:grid;place-items:center;flex:none}
.x-btn svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>span{font-size:13px;font-weight:700;color:var(--label)}
.inp{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--ground);padding:0 14px;font-size:16px;outline:none;width:100%}
.inp:focus{border:2px solid var(--ink);background:#fff}
textarea.inp{height:88px;padding:12px 14px;resize:none;line-height:1.55}
.sel{position:relative;display:block}
.sel select{appearance:none;-webkit-appearance:none;padding-right:36px}
.sel svg{position:absolute;right:14px;top:17px;width:16px;height:16px;stroke:var(--muted);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--ground);display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:0;background:#fff;font-size:20px;line-height:1}
.stepper input{width:56px;border:0;background:transparent;text-align:center;font-size:17px;font-weight:800;color:var(--teal);outline:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px}
.tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;flex:none;width:72px;height:72px;border-radius:14px;overflow:hidden;background:var(--ground)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.addph{flex:none;width:72px;height:72px;border-radius:14px;border:1.5px dashed #B8C4CB;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.sticky-foot{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(var(--sb) + 14px);margin-top:16px}
.btn-primary{width:100%;height:54px;border-radius:16px;border:0;background:var(--pin);color:#fff;font-size:16px;font-weight:800}
.btn-primary.teal{background:var(--teal)}.btn-primary.ink{background:var(--ink)}
.btn-primary:disabled{opacity:.55}
.status{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0;min-height:1em}
.err{color:#B42318}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0;text-align:center}

/* detail */
.hero{position:relative;height:280px;background:#9FC3D2}
.hero-strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero-strip::-webkit-scrollbar{display:none}
.hero-strip button{flex:none;width:100%;height:100%;border:0;padding:0;scroll-snap-align:start;background:#9FC3D2}
.hero-strip img{width:100%;height:100%;object-fit:cover;display:block}
.hero-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#24485A;font-size:14px}
.hero-empty svg{width:34px;height:34px;stroke:#24485A}
.hero-top{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between}
.hero-top>div{display:flex;gap:8px}
.circ{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center}
.circ svg{width:20px;height:20px}
.hero-count{position:absolute;right:16px;bottom:36px;height:26px;padding:0 10px;border-radius:13px;background:rgba(15,30,43,.7);color:#fff;font-size:12px;display:flex;align-items:center}
.d-body{position:relative;margin-top:-24px;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(var(--sb) + 28px)}
.badges{display:flex;gap:6px;margin-bottom:8px}
.badge{height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;display:flex;align-items:center;background:var(--ground);color:var(--label)}
.badge.visited{background:var(--pin);color:#fff}
.badge.cand{background:#fff;border:1.5px solid var(--pin);color:var(--pin)}
.d-body h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.25;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{border-radius:16px;background:var(--ground);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.teal{background:var(--teal-soft)}.stat.teal span{color:#2F5F64}.stat.teal b{color:var(--teal)}
.memo{margin:18px 0 0;font-size:15px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.memo.none{color:var(--muted)}
.d-acts{display:flex;gap:8px;margin-top:18px}
.d-acts .go{flex:1;height:50px;border-radius:14px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.sq{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.coord{margin-top:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* list */
.lrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line-2)}
.lrow:last-child{border-bottom:0}
.lrow .ph{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--ground);display:grid;place-items:center}
.mini-pin{width:26px;height:26px;border-radius:50%;background:var(--pin);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mini-pin.cand{background:#fff;border-color:var(--pin)}
.lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}

/* depth sheet */
.big-depth{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 6px}
.round-step{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:24px;line-height:1}
.big-depth .val{display:flex;align-items:baseline;gap:4px}
.big-depth input{width:130px;border:0;background:transparent;text-align:center;font-size:56px;font-weight:800;letter-spacing:-.04em;color:var(--teal);outline:none;padding:0;font-variant-numeric:tabular-nums}
.big-depth .u{font-size:20px;font-weight:700;color:var(--teal)}
.center-tags{justify-content:center;margin-top:12px}

/* search */
.search{position:fixed;inset:0;z-index:800;background:#fff;display:flex;flex-direction:column}
.search-top{display:flex;gap:8px;align-items:center;padding:calc(var(--st) + 12px) 16px 0}
.back{width:44px;height:44px;border-radius:14px;border:0;background:none;display:grid;place-items:center;flex:none}
.search-field{flex:1;height:52px;border-radius:16px;background:var(--ground);border:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;min-width:0}
.search-field input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:500;outline:none}
.clr{width:28px;height:28px;border-radius:50%;border:0;background:#B8C4CB;display:grid;place-items:center;flex:none}
.clr svg{width:11px;height:11px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round}
.cat-row{display:flex;gap:6px;padding:14px 20px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.cat-row::-webkit-scrollbar{display:none}
.cat{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px}
.search-body{flex:1;overflow:auto;padding-bottom:calc(var(--sb) + 20px)}
.s-h{padding:16px 20px 6px;font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.s-h button{border:0;background:none;padding:0;font-size:12px;color:var(--muted)}
.sres{display:flex;gap:14px;align-items:center;padding:11px 20px;width:100%;border:0;background:none;text-align:left}
.sres .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--ground);display:grid;place-items:center}
.sres .ic.harbor{background:var(--teal-soft)}
.sres .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sres b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres b em{font-style:normal;color:var(--teal)}
.sres span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .km{font-size:12px;color:var(--muted);flex:none}
.divider{height:8px;background:var(--ground);margin:10px 0}
.recent{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.recent button{height:32px;padding:0 12px;border-radius:16px;border:0;background:var(--ground);font-size:13px}
.s-msg{padding:18px 20px;color:var(--muted);font-size:14px}

/* action sheet */
.action-wrap{position:fixed;inset:0;z-index:900;background:rgba(15,30,43,.35);display:flex;align-items:flex-end}
.action-sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px calc(var(--sb) + 16px)}
.action-sheet h3{margin:4px 6px 10px;font-size:16px;font-weight:800}
.act{width:100%;height:54px;border-radius:14px;border:0;background:var(--ground);margin-top:8px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.act.danger{color:#B42318}
.act.cancel{background:#fff;border:1px solid var(--line)}

/* menu */
.menu-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.menu-sec h3{margin:0 0 6px;font-size:16px;font-weight:800}
.menu-sec p{margin:4px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.two{display:flex;gap:8px;margin-top:10px}
.two .act{margin:0}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-8px);opacity:0;z-index:2000;background:rgba(15,30,43,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lightbox{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:calc(var(--st) + 16px) 12px calc(var(--sb) + 16px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
@media (min-width:760px){
  .sheet{left:auto;width:420px;top:0;max-height:none;border-radius:0}
  .home{left:16px;right:auto;width:420px;bottom:16px;border-radius:24px}
  .fabs{bottom:calc(var(--sb) + 24px)}
  .search{left:auto;width:440px;box-shadow:-8px 0 30px rgba(15,30,43,.18)}
}
@media (prefers-reduced-motion:reduce){.sheet,.home,.fabs,.toast,.pin-dot{transition:none}.ring-lp{animation:none}}

</style>
</head>
<body>
<div id="map" aria-label="지도. 길게 누르면 포인트를 남길 수 있어요."></div>

<!-- 위쪽: 검색 + 필터 칩 -->
<header class="top" id="top">
  <div class="top-row">
    <button class="search-pill" id="openSearch" type="button">
      <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>항구, 방파제, 지명 검색</span>
    </button>
    <button class="sq-btn" id="btnMenu" type="button" aria-label="메뉴">
      <svg viewBox="0 0 24 24" class="i light"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="chips-row" id="chips"></div>
</header>

<!-- 수심 기록 / 위치 고르기 모드 바 -->
<div class="mode-bar" id="modeBar" hidden>
  <span class="mode-dot" id="modeDot"></span>
  <span class="mode-t" id="modeTitle">수심 기록 중</span>
  <span class="mode-s" id="modeSub">꾹 눌러 위치 지정</span>
  <button class="mode-x" id="modeExit" type="button">끝내기</button>
</div>

<!-- 위치 고르기 가운데 핀 -->
<div class="center-pin" id="centerPin" hidden><div class="pin-dot"></div></div>
<div class="pick-actions" id="pickActions" hidden>
  <button class="btn-primary" id="pickOk" type="button">여기로 정하기</button>
</div>

<!-- 오른쪽 버튼 -->
<div class="fabs" id="fabs">
  <button class="fab" id="btnType" type="button" aria-label="지도 종류 바꾸기"><svg viewBox="0 0 24 24" class="i"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <button class="fab depth" id="btnDepth" type="button" aria-label="수심 기록" aria-pressed="false">수심</button>
  <button class="fab" id="btnLocate" type="button" aria-label="내 위치"><svg viewBox="0 0 24 24" class="i blue"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<!-- 아래쪽: 근처 포인트 + 탭 -->
<section class="home" id="home">
  <div class="grab"></div>
  <div class="home-head"><h2>근처 포인트</h2><button class="link" id="seeAll" type="button">전체 보기</button></div>
  <div class="cards" id="nearCards"></div>
  <nav class="tabbar">
    <button class="tab on" type="button" id="tabMap"><svg viewBox="0 0 24 24" class="i"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
    <button class="tab-add" id="btnAdd" type="button" aria-label="포인트 추가"><svg viewBox="0 0 24 24" class="i light thick"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" type="button" id="tabList"><svg viewBox="0 0 24 24" class="i muted"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>내 포인트</button>
  </nav>
</section>

<!-- 공용 시트 -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세">
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- 검색 화면 -->
<section class="search" id="search" hidden aria-label="장소 검색">
  <div class="search-top">
    <button class="back" id="searchBack" type="button" aria-label="뒤로"><svg viewBox="0 0 24 24" class="i"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="search-field">

  map.flyTo(ll, 16, { duration: .8 }); $("#openSearch span").textContent = r.name;
  toast(`${r.name}: 빨간 원을 누르면 여기에 포인트를 남겨요`, 3200);
}

/* ---------- 수심 ---------- */
function depthMarker(d) {
  let m = S.depthMarkers.get(d.id);
  if (!m) { m = markerWith([d.lat, d.lng], () => h("div", { class: "snd" }, (Math.round(m._d.d * 10) / 10).toString())); m.on("click", () => openDepth(m._d.id)); S.depthMarkers.set(d.id, m); }
  m._d = d; m.setLatLng([d.lat, d.lng]); if (!map.hasLayer(m)) m.addTo(map);
}
function openDepthForm(ll) {
  if (S.draft) map.removeLayer(S.draft);
  S.draft = markerWith(ll, () => h("div", { class: "spin" }), { interactive: false, zIndexOffset: 2000 }).addTo(map);
  const num = h("input", { type: "text", inputmode: "decimal", "aria-label": "수심(m)" }); num.value = S.lastDepth.toFixed(1);
  const bump = dd => { const v = parseFloat(String(num.value).replace(",", ".")); num.value = Math.max(0, Math.round(((isFinite(v) ? v : 0) + dd) * 10) / 10).toFixed(1); };
  let meth = "finder"; const mt = h("div", { class: "tags center-tags" });
  const drawM = () => mt.replaceChildren(...Object.entries(METHODS).map(([k, v]) => h("button", { type: "button", class: "tag", "aria-pressed": String(meth === k), onclick: () => { meth = k; drawM(); } }, v))); drawM();
  const note = h("input", { class: "inp", maxlength: "60", placeholder: "메모 (선택): 만조 1시간 전, 바닥 암반", autocomplete: "off", "aria-label": "메모" });
  const st = h("p", { class: "status" }); const save = h("button", { class: "btn-primary teal", type: "button" }, "수심 저장");
  save.onclick = async () => {
    const v = parseFloat(String(num.value).replace(",", "."));
    if (!isFinite(v) || v < 0 || v > 3000) { st.className = "status err"; st.textContent = "0에서 3000 사이 숫자(m)로 적어 주세요"; return; }
    const d = { id: uid(), lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6), d: Math.round(v * 10) / 10, method: meth, note: note.value.trim().slice(0, 60), createdAt: Date.now() };
    try { await put("depths", d); S.depths.set(d.id, d); S.lastDepth = d.d; depthMarker(d); closeSheet(); toast(`수심 ${d.d}m 저장됨`); }
    catch (_) { st.className = "status err"; st.textContent = "저장하지 못했어요"; }
  };
  openSheet(h("div", { class: "sh-pad" }, head("수심 기록", `${fixed(ll.lat)}, ${fixed(ll.lng)}`),
    h("div", { class: "big-depth" }, h("button", { class: "round-step", type: "button", "aria-label": "0.5m 줄이기", onclick: () => bump(-.5) }, "−"), h("div", { class: "val" }, num, h("span", { class: "u" }, "m")), h("button", { class: "round-step", type: "button", "aria-label": "0.5m 늘리기", onclick: () => bump(.5) }, "+")),
    mt, h("div", { style: "height:14px" }), note,
    h("div", { class: "sticky-foot" }, save, st, h("p", { class: "note" }, "직접 잰 값이라 물때에 따라 달라요. 항해용으로 쓰지 마세요."))), { type: "form", id: null });
  focusOn(ll, map.getZoom());
}
function openDepth(id) {
  const d = S.depths.get(id); if (!d) return;
  openSheet(h("div", { class: "sh-pad" }, head(`수심 ${d.d}m`, `${fixed(d.lat)}, ${fixed(d.lng)}`),
    h("div", { class: "stats" }, h("div", { class: "stat teal" }, h("span", null, "수심"), h("b", null, `${d.d}m`)), h("div", { class: "stat" }, h("span", null, "잰 방법"), h("b", null, METHODS[d.method] || "-")), h("div", { class: "stat" }, h("span", null, "기록"), h("b", null, fmtTime(d.createdAt)))),
    d.note ? h("p", { class: "memo" }, d.note) : null,
    h("div", { class: "two" }, h("button", { class: "act", type: "button", onclick: () => copyText(`${fixed(d.lat)}, ${fixed(d.lng)}`, "좌표를 복사했어요") }, "좌표 복사"),
      h("button", { class: "act danger", type: "button", onclick: async () => { if (!confirm("이 수심 기록을 지울까요?")) return; await del("depths", id).catch(() => {}); S.depths.delete(id); const m = S.depthMarkers.get(id); if (m) { map.removeLayer(m); S.depthMarkers.delete(id); } closeSheet(); toast("수심 기록을 지웠어요"); } }, "삭제"))), { type: "depth" });
}

/* ---------- 내 위치 ---------- */
const G = { watch: null, fixed: false, wantFly: false, moved: false, denied: false, last: null };
map.on("dragstart", () => { G.moved = true; });
function startGeo(manual) {
  if (!navigator.geolocation) { if (manual) toast("이 기기에서는 위치를 확인할 수 없어요"); return; }
  if (manual) { if (G.last) { map.flyTo(G.last, Math.max(map.getZoom(), 15), { duration: .6 }); return; } G.wantFly = true; toast("현재 위치를 찾는 중"); }
  if (G.watch !== null) return;
  G.watch = navigator.geolocation.watchPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude); const first = !G.last; G.last = ll;
    if (!S.me) { S.me = markerWith(ll, () => h("div", { class: "me" }), { zIndexOffset: 500 }).addTo(map); S.me.on("click", () => startDraft(G.last)); } else S.me.setLatLng(ll);
    if (first) renderNear();
    if (!G.fixed || G.wantFly) { if (G.wantFly || (!G.moved && !sheet.classList.contains("open"))) map.flyTo(ll, Math.max(map.getZoom(), 13), { duration: .8 }); G.fixed = true; G.wantFly = false; }
  }, err => {
    if (G.watch !== null) navigator.geolocation.clearWatch(G.watch); G.watch = null;
    if (err.code === 1) { if (manual || !G.denied) { G.denied = true; toast("위치 권한이 꺼져 있어요. 설정에서 허용하면 내 위치가 나와요", 4000); } }
    else if (manual || G.wantFly) toast("현재 위치를 찾지 못했어요");
    G.wantFly = false;
  }, { enableHighAccuracy: true, maximumAge: 20000, timeout: 20000 });
}
$("#btnLocate").onclick = () => startGeo(true);

/* ---------- 메뉴 ---------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportAll() {
  toast("백업 파일을 만드는 중", 4000);
  const photos = []; for (const p of await getAll("photos")) photos.push({ id: p.id, data: await blobToData(p.blob) });
  const blob = new Blob([JSON.stringify({ app: "pointbook", v: 1, at: Date.now(), spots: [...S.spots.values()], depths: [...S.depths.values()], photos })], { type: "application/json" });
  const name = `pointbook-backup-${new Date().toISOString().slice(0, 10)}.json`; const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  const a = h("a", { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function importAll(file) {
  try {
    const j = JSON.parse(await file.text()); if (!j || j.app !== "pointbook") throw new Error("format");
    for (const p of j.photos || []) { const b = await (await fetch(p.data)).blob(); await put("photos", { id: p.id, blob: b }); }
    for (const s of j.spots || []) if (typeof s.lat === "number") await put("spots", s);
    for (const d of j.depths || []) if (typeof d.lat === "number") await put("depths", d);
    await loadAll(); toast(`복원했어요: 포인트 ${(j.spots || []).length}곳`);
  } catch (_) { toast("이 파일은 포인트북 백업이 아니에요"); }
}
$("#importIn").onchange = e => { const f = e.target.files[0]; if (f) importAll(f); e.target.value = ""; };
$("#btnMenu").onclick = () => {
  const inp = h("input", { class: "inp", placeholder: "카카오 JavaScript 키", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "카카오 JavaScript 키" }); inp.value = KKEY;
  const st = h("p", { class: "status" }, KKEY ? "연결됨" : "");
  const test = h("button", { class: "btn-primary ink", type: "button", style: "margin-top:10px" }, "저장하고 시험하기");
  test.onclick = async () => {
    KKEY = inp.value.trim(); try { localStorage.setItem("pb-kakao-key", KKEY); } catch (_) {}
    kakaoP = null; cache.clear(); warned = false; if (!KKEY) { st.textContent = "연결을 해제했어요"; return; }
    st.className = "status"; st.textContent = "시험하는 중";
    try { const r = await searchKakao("양양 오산항"); st.textContent = r.length ? `연결됨: '${r[0].name}' 검색 성공` : "연결됨"; }
    catch (_) { st.className = "status err"; st.textContent = "연결 실패. JavaScript 키와 도메인 등록, 카카오맵 사용 설정을 확인하세요."; }
  };
  openSheet(h("div", { class: "sh-pad" }, head("메뉴", "체험판: 포인트와 사진은 이 폰에만 저장돼요"),
    h("div", { class: "menu-sec" }, h("h3", null, "백업"), h("p", null, "브라우저 기록을 지우면 데이터가 사라질 수 있어요. 가끔 백업해 두세요."),
      h("div", { class: "two" }, h("button", { class: "act", type: "button", onclick: exportAll }, "백업 저장"), h("button", { class: "act", type: "button", onclick: () => $("#importIn").click() }, "불러오기"))),
    h("div", { class: "menu-sec" }, h("h3", null, "카카오 장소 검색"), h("p", null, "항구, 방파제, 낚시점까지 카카오맵 결과로 찾아요."), h("div", { style: "height:10px" }), inp, test, st),
    h("div", { class: "menu-sec" }, h("p", null, "지도: OpenStreetMap, Esri 위성사진, OpenTopoMap. 장소 검색: 카카오(연결 시) 또는 OpenStreetMap."))), { type: "menu" });
};

/* ---------- 시작 ---------- */
$("#centerPin .pin-dot").append(svg(ICON.star, ""));
async function loadAll() {
  for (const m of S.markers.values()) map.removeLayer(m); for (const m of S.depthMarkers.values()) map.removeLayer(m);
  S.markers.clear(); S.depthMarkers.clear(); S.spots.clear(); S.depths.clear();
  for (const s of await getAll("spots")) if (typeof s.lat === "number") { S.spots.set(s.id, s); upsertMarker(s); }
  for (const d of await getAll("depths")) if (typeof d.lat === "number") { S.depths.set(d.id, d); depthMarker(d); }
  renderChips(); renderNear();
}
(async () => {
  renderChips();
  try { DBH = await openDB(); await loadAll(); }
  catch (_) { toast("이 브라우저에서는 저장 공간을 쓸 수 없어요. 사파리나 크롬 일반 창에서 열어 주세요.", 5000); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
  startGeo(false);
})();
